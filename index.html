<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAFAF8">
  <title>Thrift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <a href="#/" class="brand" id="brand"></a>
      <nav class="nav" id="nav"></nav>
    </div>
    <form class="search" id="searchForm" role="search">
      <input id="searchInput" type="search" placeholder="Search dresses, sneakers, blenders…" aria-label="Search items">
    </form>
  </header>

  <main id="app" class="wrap"></main>

  <a href="#/sell" class="sell-fab" id="sellFab">Sell an item</a>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
