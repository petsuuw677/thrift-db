<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Thrift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <a href="#/" class="brand" id="brand"></a>
      <nav class="side-nav" id="sideNav" aria-label="Main"></nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>

    <div class="main">
      <header class="top">
        <a href="#/" class="brand brand-m" id="brandM"></a>
        <form class="search" id="searchForm" role="search">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="searchInput" type="search" placeholder="Search dresses, sneakers, phones…" aria-label="Search items">
        </form>
        <div class="top-right" id="topRight"></div>
      </header>
      <main id="app" class="wrap"></main>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
